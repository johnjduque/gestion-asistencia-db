name: DB Quality Gate CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

# Minimo por defecto; cada job declara lo que necesita (VAL oleada 2).
permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  db-quality-gate:
    name: Database Deployment & Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set MSSQL Password Environment
        id: mssql-env
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MSSQL_SA_PASSWORD:-}" ]; then
            echo "::error::MSSQL_SA_PASSWORD repository secret is required."
            exit 1
          fi
          printf 'MSSQL_SA_PASSWORD=%s\n' "$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"

      - name: Start MSSQL Docker Container
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sqlserver \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for MSSQL Engine Readiness
        id: mssql-ready
        shell: pwsh
        run: |
          $maxAttempts = 60
          $attempt = 0
          $ready = $false
          $sqlcmdPath = $null
          $sqlcmdCandidates = @(
              '/opt/mssql-tools18/bin/sqlcmd',
              '/opt/mssql-tools/bin/sqlcmd'
          )

          while (-not $ready -and $attempt -lt $maxAttempts) {
              $attempt++
              Write-Host "Waiting for MSSQL Server engine... (Attempt $attempt/$maxAttempts)"

              $state = docker inspect sqlserver --format '{{.State.Status}}|{{.State.ExitCode}}' 2>&1
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "MSSQL container state is not inspectable yet."
                  Start-Sleep -Seconds 2
                  continue
              }
              $stateParts = ($state -join '') -split '\|'
              if ($stateParts[0] -ne 'running') {
                  throw "MSSQL container is not running (status=$($stateParts[0]); exit_code=$($stateParts[1]))."
              }

              if (-not $sqlcmdPath) {
                  foreach ($candidate in $sqlcmdCandidates) {
                      docker exec sqlserver sh -c "test -x '$candidate'" 2>$null
                      if ($LASTEXITCODE -eq 0) {
                          $sqlcmdPath = $candidate
                          break
                      }
                  }
              }

              if (-not $sqlcmdPath) {
                  if ($attempt -eq 1 -or $attempt % 10 -eq 0) {
                      Write-Host 'sqlcmd was not found in the supported container paths yet.'
                  }
                  Start-Sleep -Seconds 2
                  continue
              }

              $check = docker exec sqlserver $sqlcmdPath -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -b -Q "SELECT 1;" 2>&1
              $probeExitCode = $LASTEXITCODE
              if ($probeExitCode -eq 0) {
                  $ready = $true
                  Write-Host "MSSQL Server Engine is READY! sqlcmd_path=$sqlcmdPath" -ForegroundColor Green
              } elseif ($attempt -eq 1 -or $attempt % 10 -eq 0) {
                  $safeCheck = (($check -join ' ') -replace '(?i)(password|secret|token)(\s*[:=]\s*)\S+', '$1$2[REDACTED]')
                  Write-Host "MSSQL readiness probe still pending (sqlcmd_path=$sqlcmdPath; exit_code=$probeExitCode; output=$safeCheck)"
              }
              Start-Sleep -Seconds 2
          }
          if (-not $ready) {
              throw "MSSQL Server failed to start within time limit."
          }

      - name: Diagnose MSSQL readiness failure
        if: always() && steps.mssql-ready.outcome != 'success'
        continue-on-error: true
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host '--- docker ps -a ---'
          docker ps -a --no-trunc --filter "name=sqlserver"

          Write-Host '--- docker inspect (sanitized state only) ---'
          $inspect = docker inspect sqlserver --format '{{json .State}}' 2>&1
          $safeInspect = (($inspect -join [Environment]::NewLine) -replace '(?i)(password|secret|token)(\s*[:=]\s*)\S+', '$1$2[REDACTED]')
          Write-Host $safeInspect

          Write-Host '--- container logs (sanitized, last 200 lines) ---'
          $logs = docker logs --tail 200 sqlserver 2>&1
          $safeLogs = (($logs -join [Environment]::NewLine) -replace '(?i)(password|secret|token)(\s*[:=]\s*)\S+', '$1$2[REDACTED]')
          Write-Host $safeLogs

          Write-Host '--- sqlcmd availability ---'
          $sqlcmdCandidates = @(
              '/opt/mssql-tools18/bin/sqlcmd',
              '/opt/mssql-tools/bin/sqlcmd'
          )
          $availablePaths = @()
          foreach ($candidate in $sqlcmdCandidates) {
              docker exec sqlserver sh -c "test -x '$candidate'" 2>$null
              $available = ($LASTEXITCODE -eq 0)
              Write-Host "$candidate available=$available"
              if ($available) {
                  $availablePaths += $candidate
              }
          }

          Write-Host '--- authentication validation ---'
          $status = docker inspect sqlserver --format '{{.State.Status}}' 2>$null
          if ($status -eq 'running' -and $availablePaths.Count -gt 0) {
              $auth = docker exec sqlserver $availablePaths[0] -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -b -Q "SELECT SUSER_SNAME(), DB_NAME();" 2>&1
              $authExitCode = $LASTEXITCODE
              $safeAuth = (($auth -join ' ') -replace '(?i)(password|secret|token)(\s*[:=]\s*)\S+', '$1$2[REDACTED]')
              Write-Host "authentication_exit_code=$authExitCode output=$safeAuth"
          } else {
              Write-Host "authentication_validation=NOT_RUN container_status=$status sqlcmd_paths=$($availablePaths.Count)"
          }

      - name: Verify Baseline Freeze Manifest Integrity
        id: freeze-manifest
        shell: pwsh
        run: |
          ./scripts/freeze-manifest.ps1 -Mode Verify

      - name: Deploy Database Schema (deploy_schema.ps1)
        id: deploy-schema
        shell: pwsh
        run: |
          ./deploy_schema.ps1 -ContainerName "sqlserver" -Password $env:MSSQL_SA_PASSWORD

      - name: Prepare LB-004D test fixture
        id: lb004d-fixture
        shell: pwsh
        run: |
          ./test/prepare_lb004d_fixture.ps1 -ContainerName "sqlserver" -AdminPassword $env:MSSQL_SA_PASSWORD

      - name: Execute DB Quality Gate (test_summary.ps1)
        id: db-quality
        shell: pwsh
        run: |
          & ./test_summary.ps1 -ContainerName "sqlserver" -Password $env:MSSQL_SA_PASSWORD *>&1 | Tee-Object -FilePath db-quality-summary.log
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Cleanup LB-004D test fixture
        if: always()
        id: lb004d-fixture-cleanup
        shell: pwsh
        run: |
          ./test/cleanup_lb004d_fixture.ps1 -ContainerName "sqlserver" -AdminPassword $env:MSSQL_SA_PASSWORD

      # TRI-04 (VAL oleada 2, decision E): inventario SARIF (Code Scanning + artifact) y compuerta
      # que bloquea HIGH/CRITICAL con correccion disponible, misconfig y secretos.
      - name: Trivy Security Inventory (Filesystem, SARIF)
        id: trivy-inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: db-trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: false

      - name: Trivy Security Scan (Filesystem gate)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          output: ''
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Publish Trivy findings to Code Scanning
        if: always() && hashFiles('db-trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: db-trivy-fs.sarif
          category: trivy-db-filesystem

      - name: SonarCloud Analysis and Quality Gate
        id: sonar-analysis
        # sonarcloud-github-action@master era una etiqueta mutable y la accion esta deprecada; se usa
        # la oficial fijada por SHA. qualitygate.wait hace fallar el paso si el gate queda en ERROR.
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate CI Job Summary
        if: always()
        shell: pwsh
        run: |
          $summaryLines = @(
              '### 🛡️ Resumen de Puerta de Calidad (DB Quality Gate)',
              '- **Motor:** SQL Server 2022 (Linux Container)'
          )
          $readyStatus = '${{ steps.mssql-ready.outcome }}'
          $manifestStatus = '${{ steps.freeze-manifest.outcome }}'
          $schemaStatus = '${{ steps.deploy-schema.outcome }}'
          $dbStatus = '${{ steps.db-quality.outcome }}'
          $trivyStatus = '${{ steps.trivy-scan.outcome }}'
          $sonarStatus = '${{ steps.sonar-analysis.outcome }}'
          $summaryLines += "- **Readiness SQL Server:** $readyStatus"
          $summaryLines += "- **Manifiesto de Congelamiento:** $manifestStatus"
          $summaryLines += "- **Despliegue de Esquema:** $schemaStatus"
          $summaryPath = Join-Path $env:GITHUB_WORKSPACE 'db-quality-summary.log'
          $verificationFailures = @()
          if (Test-Path $summaryPath) {
              $summary = Get-Content $summaryPath -Raw
              $expected = [regex]::Match($summary, '(?m)^TOTAL_EXPECTED=(\d+)').Groups[1].Value
              $executed = [regex]::Match($summary, '(?m)^TOTAL_EXECUTED=(\d+)').Groups[1].Value
              $passed = [regex]::Match($summary, '(?m)^PASSED=(\d+)').Groups[1].Value
              $failed = [regex]::Match($summary, '(?m)^FAILED=(\d+)').Groups[1].Value
              $skipped = [regex]::Match($summary, '(?m)^SKIPPED=(\d+)').Groups[1].Value
              $allowedSkipped = [regex]::Match($summary, '(?m)^ALLOWED_SKIPPED=(\d+)').Groups[1].Value
              $criticalMissing = [regex]::Match($summary, '(?m)^CRITICAL_MISSING=(\d+)').Groups[1].Value
              $sqlExit = [regex]::Match($summary, '(?m)^SQLCMD_EXIT_CODE=(-?\d+)').Groups[1].Value
              $sqlErrors = [regex]::Match($summary, '(?m)^SQL_ERROR_COUNT=(\d+)').Groups[1].Value
              $unauthorizedSkips = [regex]::Match($summary, '(?m)^UNAUTHORIZED_SKIPS=(\d+)').Groups[1].Value
              $secretStatus = if ($summary -match '(?m)^TEST_PASS:NO_HARDCODED_DB_PASSWORD\s*$') { 'PASS' } else { 'NOT_RUN' }
              $summaryLines += "- **Suite de Pruebas T-SQL:** Expected=$expected; Executed=$executed; Passed=$passed; Failed=$failed; Skipped=$skipped; AllowedSkipped=$allowedSkipped"
              $summaryLines += "- **Integridad de ejecución SQL:** CriticalMissing=$criticalMissing; SQLCMD=$sqlExit; SQLErrors=$sqlErrors; UnauthorizedSkips=$unauthorizedSkips"
              $summaryLines += "- **Higiene de Secretos:** $secretStatus"
              $summaryLines += "- **Escaneo Trivy:** $trivyStatus"
              if ($summary -notmatch '(?m)^TOTAL_EXPECTED=\d+$' -or $summary -notmatch '(?m)^TOTAL_EXECUTED=\d+$' -or $summary -notmatch '(?m)^PASSED=\d+$' -or $summary -notmatch '(?m)^FAILED=\d+$' -or $summary -notmatch '(?m)^SKIPPED=\d+$' -or $summary -notmatch '(?m)^CRITICAL_MISSING=\d+$') {
                  $verificationFailures += 'DB test summary is incomplete.'
              }
              if ($failed -ne '0' -or $criticalMissing -ne '0' -or $sqlExit -ne '0' -or $sqlErrors -ne '0' -or $unauthorizedSkips -ne '0') {
                  $verificationFailures += 'DB quality gate counters are not clean.'
              }
              if ($secretStatus -ne 'PASS') {
                  $verificationFailures += 'Secret hygiene evidence is missing.'
              }
          } else {
              $summaryLines += '- **Suite de Pruebas T-SQL:** NOT_RUN (summary unavailable)'
              $summaryLines += '- **Integridad de ejecución SQL:** NOT_RUN'
              $summaryLines += '- **Higiene de Secretos:** NOT_RUN'
              $verificationFailures += 'DB test summary was not produced.'
          }
          $sonarGateStatus = if ($sonarStatus -eq 'success') { 'PASS' } elseif ($sonarStatus -eq 'skipped') { 'NOT_RUN' } else { 'FAIL' }
          $summaryLines += "- **SonarCloud Analysis:** $sonarStatus"
          $summaryLines += "- **SonarCloud Quality Gate:** $sonarGateStatus"
          if ($readyStatus -ne 'success') { $verificationFailures += "SQL Server readiness status=$readyStatus." }
          if ($manifestStatus -ne 'success') { $verificationFailures += "Manifest validation status=$manifestStatus." }
          if ($schemaStatus -ne 'success') { $verificationFailures += "Schema deployment status=$schemaStatus." }
          if ($dbStatus -ne 'success') { $verificationFailures += "SQL test gate status=$dbStatus." }
          if ($trivyStatus -ne 'success') { $verificationFailures += "Trivy security scan status=$trivyStatus." }
          if ($sonarStatus -ne 'success') { $verificationFailures += "Sonar analysis/quality gate status=$sonarStatus." }
          if ($verificationFailures.Count -gt 0) {
              $summaryLines += "- **Critical verification result:** FAIL ($($verificationFailures -join ' | '))"
          } else {
              $summaryLines += '- **Critical verification result:** PASS'
          }
          $summaryLines | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'ci-gate-evidence.md') -Encoding utf8
          $summaryLines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($verificationFailures.Count -gt 0) {
              throw ($verificationFailures -join ' ')
          }

      - name: Upload DB quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-quality-evidence
          path: |
            db-quality-summary.log
            ci-gate-evidence.md
            db-trivy-fs.sarif
          if-no-files-found: error

  # SEC-05 / SEC-08 (VAL oleada 2): gitleaks bloquea secretos nuevos. Solo escanea los commits que
  # trae el PR (o el push), no el historial completo: el historial ya contiene valores viejos que
  # quedaron invalidados con la rotacion de credenciales (ver docs/work-items/VAL-oleada2-cumplimiento).
  # Se usa el binario oficial con SHA-256 fijado (gitleaks-action exige licencia para cuentas de organizacion).
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for the commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum verified)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan commits introduced by this change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="-1 ${PUSH_AFTER}"
          fi
          echo "Gitleaks commit range: ${range}"
          gitleaks git . \
            --config .github/gitleaks.toml \
            --log-opts="${range}" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
