# EST-09 (VAL oleada 2): actualizacion automatica semanal de dependencias.
# Los PR de Dependabot pasan por las mismas compuertas (Trivy, gitleaks, Sonar, pruebas).
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      docker_compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-patch:
        update-types: [minor, patch]
